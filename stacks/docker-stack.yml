networks:
  pgvisor-net:
    driver: overlay
    attachable: true

volumes:
  minio_data:
  node1_data:
  node2_data:
  node3_data:

services:
  minio:
    image: rustfs/rustfs:latest
    networks:
      - pgvisor-net
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9000/health" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-node1:
    image: dreamoutbox/pgvisor:latest
    networks:
      - pgvisor-net
    environment:
      POSTGRES_USER: postgres
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_NODE_ID: 1
      PGVISOR_ROLE: leader
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      RUST_LOG: info
    volumes:
      - node1_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-node2:
    image: dreamoutbox/pgvisor:latest
    networks:
      - pgvisor-net
    environment:
      POSTGRES_USER: postgres
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=postgres
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_NODE_ID: 2
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      RUST_LOG: info
    volumes:
      - node2_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-node3:
    image: dreamoutbox/pgvisor:latest
    networks:
      - pgvisor-net
    environment:
      POSTGRES_USER: postgres
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=postgres
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_NODE_ID: 3
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      RUST_LOG: info
    volumes:
      - node3_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-proxy:
    image: dreamoutbox/pgvisor:latest
    entrypoint: [ "pgvisor-proxy" ]
    networks:
      - pgvisor-net
    ports:
      - target: 5432
        published: 5432
        mode: ingress
      - target: 8080
        published: 8080
        mode: ingress
    environment:
      PGVISOR_PROXY_LISTEN: 0.0.0.0:5432
      PGVISOR_DASHBOARD_LISTEN: 0.0.0.0:8080
      PGVISOR_LEADER_ADDR: pgvisor-node1:5432
      PGVISOR_STANDBY_ADDRS: pgvisor-node2:5432,pgvisor-node3:5432
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RUST_LOG: info
      PGVISOR_ADMIN_TOKEN: postgres
    deploy:
      replicas: 1
      restart_policy:
        condition: any
