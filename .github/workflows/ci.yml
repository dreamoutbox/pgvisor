name: PgVisor CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo unit tests
        run: cargo test --workspace

      - name: Install test client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client jq

      - name: Generate test Docker Compose profiles
        run: ./scripts/generate-test-composes.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-build test Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dreamoutbox/pgvisor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure test log directory exists
        run: mkdir -p tests/.logs

      - name: Run integration test suite
        run: ./test.sh -j 1 --ci --fail-fast

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: ${{ github.workspace }}/tests/.logs/
          include-hidden-files: true
          if-no-files-found: warn

  docker:
    name: Build & Publish Docker Image
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: ${{ vars.DOCKERHUB_REPO || 'dreamoutbox/pgvisor' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: [test]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl_deps: true
            linker: ""
            rustflags: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            musl_deps: false
            linker: rust-lld
            rustflags: "-C target-feature=+crt-static"
          - target: aarch64-apple-darwin
            os: macos-latest
            musl_deps: false
            linker: ""
            rustflags: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            musl_deps: false
            linker: ""
            rustflags: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.musl_deps
        run: ./scripts/install-musl-tools.sh

      - name: Build and package pgvisor CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: ./scripts/build-cli-release.sh ${{ matrix.target }}

      - name: Upload CLI release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/pgvisor-*.tar.gz*

  release:
    name: Create GitHub Release
    needs: [test, docker, build-cli]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CLI release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS
        run: ./scripts/generate-cli-checksums.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
