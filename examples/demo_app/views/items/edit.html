{% extends "base.html" %}

{% block title %}Edit Item #{{ item.id }} &mdash; PgVisor MVC{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-pencil-square text-primary me-2"></i>Edit Item #{{ item.id }}
                </h5>
                <a href="{{ url_for('items.index') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Back to Items
                </a>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('items.update', item_id=item.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ item.title }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Category</label>
                            <input type="text" class="form-control" id="category" name="category" value="{{ item.category }}">
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="Active" {% if item.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Pending" {% if item.status == 'Pending' %}selected{% endif %}>Pending</option>
                                <option value="Archived" {% if item.status == 'Archived' %}selected{% endif %}>Archived</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ item.description }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('items.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2 me-1"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
