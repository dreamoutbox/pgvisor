# ==============================================================================
# PgVisor - 3-Node High-Availability PostgreSQL Cluster Example
#
# Components:
#   - 1 Leader node (PostgreSQL 18 + OpenRaft sidecar supervisor)
#   - 2 Standby replica nodes (streaming replication from leader)
#   - 1 L7 Postgres proxy (read/write splitting, failover buffer, web dashboard)
#   - 1 S3 storage service (MinIO / RustFS for continuous WAL archiving & PITR)
# ==============================================================================

volumes:
  minio_data:
  node1_data:
  node2_data:
  node3_data:
  node4_data:

services:
  # S3-compatible object storage for basebackup snapshots & WAL archives
  minio:
    image: rustfs/rustfs:latest
    container_name: pgvisor-minio
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot initializer ensuring S3 backup bucket exists
  minio-init:
    image: rustfs/rustfs:latest
    container_name: pgvisor-minio-init
    cpus: 1
    mem_limit: 1g
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-pgvisor-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    entrypoint: [ "/scripts/init-s3-bucket.sh" ]

  # Node 1: Initial Raft Leader and PostgreSQL Primary
  pgvisor-node1:
    image: ${PGVISOR_IMAGE:-dreamoutbox/pgvisor:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgvisor-node1
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PGVISOR_CLUSTER_ID: ${PGVISOR_CLUSTER_ID:-pgvisor-cluster}
      PGVISOR_NODE_ID: 1
      PGVISOR_ROLE: leader
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pgvisor-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - node1_data:/var/lib/postgresql/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  # Node 2: Standby Replica (Streaming Replication from Leader)
  pgvisor-node2:
    image: ${PGVISOR_IMAGE:-dreamoutbox/pgvisor:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgvisor-node2
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=${POSTGRES_USER:-postgres}
      PGVISOR_CLUSTER_ID: ${PGVISOR_CLUSTER_ID:-pgvisor-cluster}
      PGVISOR_NODE_ID: 2
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pgvisor-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - node2_data:/var/lib/postgresql/data
    depends_on:
      pgvisor-node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  # Node 3: Standby Replica (Streaming Replication from Leader)
  pgvisor-node3:
    image: ${PGVISOR_IMAGE:-dreamoutbox/pgvisor:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgvisor-node3
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=${POSTGRES_USER:-postgres}
      PGVISOR_CLUSTER_ID: ${PGVISOR_CLUSTER_ID:-pgvisor-cluster}
      PGVISOR_NODE_ID: 3
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pgvisor-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - node3_data:/var/lib/postgresql/data
    depends_on:
      pgvisor-node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  # Node 4: Standby Replica (Streaming Replication from Leader)
  pgvisor-node4:
    image: ${PGVISOR_IMAGE:-dreamoutbox/pgvisor:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgvisor-node4
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=${POSTGRES_USER:-postgres}
      PGVISOR_CLUSTER_ID: ${PGVISOR_CLUSTER_ID:-pgvisor-cluster}
      PGVISOR_NODE_ID: 4
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pgvisor-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - node4_data:/var/lib/postgresql/data
    depends_on:
      pgvisor-node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  # L7 Postgres Proxy + Embedded Web Dashboard
  pgvisor-proxy:
    image: ${PGVISOR_IMAGE:-dreamoutbox/pgvisor:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pgvisor-proxy
    entrypoint: [ "pgvisor-proxy" ]
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    ports:
      - "${PGVISOR_PORT:-5432}:5432"
      - "${PGVISOR_DASHBOARD_PORT:-8080}:8080"
    environment:
      PGVISOR_PROXY_LISTEN: 0.0.0.0:5432
      PGVISOR_DASHBOARD_LISTEN: 0.0.0.0:8080
      PGVISOR_LEADER_ADDR: pgvisor-node1:5432
      PGVISOR_STANDBY_ADDRS: pgvisor-node2:5432,pgvisor-node3:5432
      PGVISOR_CLUSTER_ID: ${PGVISOR_CLUSTER_ID:-pgvisor-cluster}
      PGVISOR_ADMIN_TOKEN: ${PGVISOR_ADMIN_TOKEN:-postgres}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pgvisor-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      PGVISOR_BACKUP_CRON_ENABLED: ${PGVISOR_BACKUP_CRON_ENABLED:-true}
      PGVISOR_BACKUP_KEEP_COUNT: ${PGVISOR_BACKUP_KEEP_COUNT:-10}
      PGVISOR_BACKUP_RETENTION_DAYS: ${PGVISOR_BACKUP_RETENTION_DAYS:-7}
      PGVISOR_BACKUP_FULL_CRON: ${PGVISOR_BACKUP_FULL_CRON:-0 1 * * *}
      PGVISOR_BACKUP_INCREMENTAL_CRON: ${PGVISOR_BACKUP_INCREMENTAL_CRON:-0 * * * *}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      pgvisor-node1:
        condition: service_healthy
      pgvisor-node2:
        condition: service_healthy
      pgvisor-node3:
        condition: service_healthy
