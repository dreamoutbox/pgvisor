[workspace]
resolver = "2"
members = [
    "crates/pgvisor-core",
    "crates/pgvisor-proxy",
    "crates/pgvisor-sidecar",
    "crates/pgvisor-dashboard",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1"
byteorder = "1.5"
crc32fast = "1.4"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tokio-util = { version = "0.7", features = ["codec"] }
opendal = { version = "0.50", default-features = false, features = [
    "services-s3",
    "services-fs",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
askama = "0.12"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
pgwire = { version = "0.41", default-features = false }
croner = { version = "4.0", default-features = false, features = ["chrono"] }
flate2 = "1.0"
tar = "0.4"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls-pki-types = "1"
rustls-pemfile = "2"
