[workspace]
resolver = "2"
members = [
    "crates/pgvisor-core",
    "crates/pgvisor-proxy",
    "crates/pgvisor-sidecar",
    "crates/pgvisor-dashboard",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1"
byteorder = "1.5"
crc32fast = "1.4"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tokio-util = { version = "0.7", features = ["codec"] }
opendal = { version = "0.50", default-features = false, features = ["services-s3", "services-fs"] }
chrono = { version = "0.4", features = ["serde"] }
