<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PgVisor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root, [data-bs-theme="dark"] {
            --bs-body-bg: #0f172a;
            --bs-body-color: #f8fafc;
            --bs-border-color: #334155;
        }

        .login-card {
            max-width: 420px;
            background-color: #1e293b;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 p-4">
    <div class="card login-card w-100 shadow-lg p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-3 bg-info bg-opacity-10 text-info mb-3" style="width: 48px; height: 48px;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                </div>
                <h1 class="h4 fw-bold mb-1">PgVisor Dashboard</h1>
                <p class="text-secondary small mb-0">Enter your cluster API token to continue</p>
            </div>

            {% if let Some(err) = error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
                <span>{{ err }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label small text-secondary fw-medium">Username</label>
                    <input type="text" id="username" name="username" class="form-control bg-dark border-secondary-subtle" placeholder="postgres" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small text-secondary fw-medium">Password</label>
                    <input type="password" id="password" name="password" class="form-control bg-dark border-secondary-subtle" placeholder="Enter password..." required>
                </div>
                <button type="submit" class="btn btn-info w-100 fw-semibold">Sign In</button>
            </form>
        </div>
    </div>
</body>

</html>
