<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PgVisor Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root, [data-bs-theme="dark"] {
            --bs-body-bg: #0f172a;
            --bs-body-color: #f8fafc;
            --bs-tertiary-bg: #1e293b;
            --bs-border-color: #334155;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --success: #4ade80;
            --warning: #facc15;
            --danger: #f87171;
            --accent: #818cf8;
        }

        aside.sidebar {
            width: 260px;
            flex-shrink: 0;
            background-color: var(--bg-card);
        }

        .card {
            background-color: var(--bg-card);
            border-color: var(--border);
        }

        .table {
            --bs-table-bg: var(--bg-card);
            --bs-table-hover-bg: var(--bg-card-hover);
            --bs-table-border-color: var(--border);
        }

        .badge-healthy { background: rgba(74, 222, 128, 0.2); color: var(--success); }
        .badge-degraded { background: rgba(250, 204, 21, 0.2); color: var(--warning); }
        .badge-fenced, .badge-offline, .badge-stopped { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
        .badge-leader, .badge-primary { background: rgba(56, 189, 248, 0.2); color: var(--primary); }
        .badge-standby, .badge-learner { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
    </style>
</head>

<body class="d-flex min-vh-100">
    <aside class="sidebar border-end p-3 d-flex flex-column gap-4">
        <div class="d-flex align-items-center gap-2 fs-5 fw-bold text-info px-2 pt-1">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            PgVisor
        </div>
        <nav class="nav nav-pills flex-column gap-1">
            <a href="/" class="nav-link {% block nav_overview %}{% endblock %}">Overview</a>
            <a href="/nodes" class="nav-link {% block nav_nodes %}{% endblock %}">Cluster Nodes</a>
            <a href="/tables" class="nav-link {% block nav_tables %}{% endblock %}">Tables &amp; SQL</a>
            <a href="/backups" class="nav-link {% block nav_backups %}{% endblock %}">Backups</a>
            <a href="/users" class="nav-link {% block nav_users %}{% endblock %}">Users &amp; Roles</a>
            <a href="/audit-logs" class="nav-link {% block nav_audit %}{% endblock %}">Audit Logs</a>
        </nav>
        {% if auth_enabled %}
        <div class="mt-auto pt-3 border-top d-flex flex-column gap-2">
            <div class="d-flex align-items-center gap-2 small text-success px-2">
                <span class="rounded-circle bg-success d-inline-block" style="width: 8px; height: 8px;"></span>
                Admin Authenticated
            </div>
            <a href="/logout" class="btn btn-outline-secondary btn-sm w-100">Log Out</a>
        </div>
        {% endif %}
    </aside>
    <main class="flex-grow-1 p-4 overflow-auto">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
