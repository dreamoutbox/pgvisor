# Auto-generated test compose file for restart-leader profile
# Generated from docker-compose.yml by scripts/generate_test_composes.py
volumes:
  minio_data:
  node1_data:
  node2_data:
  node3_data:
  proxy_tls_data:

services:
  minio:
    image: rustfs/rustfs:latest
    container_name: pgvisor-restart-leader-minio
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    ports:
      - "10800:9000"
      - "10801:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9000/health" ]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-init:
    image: rustfs/rustfs:latest
    container_name: pgvisor-restart-leader-minio-init
    cpus: 1
    mem_limit: 1g
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../scripts:/scripts:ro
    entrypoint: [ "/scripts/init-s3-bucket.sh" ]

  pgvisor-node1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pgvisor-test-node:latest
    container_name: pgvisor-restart-leader-node1
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_NODE_ID: 1
      PGVISOR_ROLE: leader
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      PGVISOR_TLS_ENABLED: ${PGVISOR_TLS_ENABLED:-false}
      PGVISOR_TLS_CERT_FILE: ${PGVISOR_TLS_CERT_FILE:-}
      PGVISOR_TLS_KEY_FILE: ${PGVISOR_TLS_KEY_FILE:-}
      RUST_LOG: info
    volumes:
      - node1_data:/var/lib/postgresql/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-node2:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pgvisor-test-node:latest
    container_name: pgvisor-restart-leader-node2
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=postgres
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_NODE_ID: 2
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      PGVISOR_TLS_ENABLED: ${PGVISOR_TLS_ENABLED:-false}
      PGVISOR_TLS_CERT_FILE: ${PGVISOR_TLS_CERT_FILE:-}
      PGVISOR_TLS_KEY_FILE: ${PGVISOR_TLS_KEY_FILE:-}
      RUST_LOG: info
    volumes:
      - node2_data:/var/lib/postgresql/data
    depends_on:
      pgvisor-node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-node3:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pgvisor-test-node:latest
    container_name: pgvisor-restart-leader-node3
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      PGPORT: 5432
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_CONNINFO: host=pgvisor-node1 port=5432 user=postgres
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_NODE_ID: 3
      PGVISOR_ROLE: standby
      PGVISOR_PEERS: http://pgvisor-node1:8080,http://pgvisor-node2:8080,http://pgvisor-node3:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      PGVISOR_TLS_ENABLED: ${PGVISOR_TLS_ENABLED:-false}
      PGVISOR_TLS_CERT_FILE: ${PGVISOR_TLS_CERT_FILE:-}
      PGVISOR_TLS_KEY_FILE: ${PGVISOR_TLS_KEY_FILE:-}
      RUST_LOG: info
    volumes:
      - node3_data:/var/lib/postgresql/data
    depends_on:
      pgvisor-node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1" ]
      interval: 3s
      timeout: 3s
      retries: 10

  pgvisor-proxy:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pgvisor-test-proxy:latest
    container_name: pgvisor-restart-leader-proxy
    entrypoint: [ "pgvisor-proxy" ]
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    ports:
      - "7232:5432"
      - "9880:8080"
    environment:
      PGVISOR_PROXY_LISTEN: 0.0.0.0:5432
      PGVISOR_DASHBOARD_LISTEN: 0.0.0.0:8080
      PGVISOR_LEADER_ADDR: pgvisor-node1:5432
      PGVISOR_STANDBY_ADDRS: pgvisor-node2:5432,pgvisor-node3:5432
      PGVISOR_CLUSTER_ID: pgvisor-cluster
      PGVISOR_CLUSTER_SECRET: ${PGVISOR_CLUSTER_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pgvisor-backups
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PGVISOR_BACKUP_CRON_ENABLED: "true"
      PGVISOR_BACKUP_KEEP_COUNT: 10
      PGVISOR_BACKUP_RETENTION_DAYS: 7
      PGVISOR_BACKUP_FULL_CRON: "0 1 * * *"
      PGVISOR_BACKUP_INCREMENTAL_CRON: "0 * * * *"
      RUST_LOG: info
      PGVISOR_ADMIN_TOKEN: postgres
      PGVISOR_TLS_ENABLED: ${PGVISOR_TLS_ENABLED:-false}
      PGVISOR_TLS_REQUIRED: ${PGVISOR_TLS_REQUIRED:-false}
      PGVISOR_TLS_CERT_DIR: /var/lib/postgresql/tls
      PGVISOR_TLS_CERT_FILE: ${PGVISOR_TLS_CERT_FILE:-}
      PGVISOR_TLS_KEY_FILE: ${PGVISOR_TLS_KEY_FILE:-}
    volumes:
      - ../scripts:/scripts:ro
      - proxy_tls_data:/var/lib/postgresql/tls
    depends_on:
      pgvisor-node1:
        condition: service_healthy
      pgvisor-node2:
        condition: service_healthy
      pgvisor-node3:
        condition: service_healthy
