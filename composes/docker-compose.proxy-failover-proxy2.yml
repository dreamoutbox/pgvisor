# Auto-generated overlay for pgvisor-proxy-failover testing
services:
  pgvisor-proxy2:
    image: dreamoutbox/pgvisor:latest
    pull_policy: never
    container_name: pgvisor-proxy-failover-proxy2
    entrypoint: [ "pgvisor-proxy" ]
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    ports:
      - "6833:5432"
    environment:
      PGVISOR_PROXY_LISTEN: 0.0.0.0:5432
      PGVISOR_LEADER_ADDR: pgvisor-node1:5432
      PGVISOR_STANDBY_ADDRS: pgvisor-node2:5432,pgvisor-node3:5432
      RUST_LOG: info
    volumes:
      - ../scripts:/scripts:ro
    depends_on:
      pgvisor-node1:
        condition: service_healthy
      pgvisor-node2:
        condition: service_healthy
      pgvisor-node3:
        condition: service_healthy
